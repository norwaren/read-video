[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "read-video"
version = "0.1.0"
description = "Read a video: grab frames with ffmpeg and transcribe speech with faster-whisper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "norwaren" }]
keywords = ["video", "transcription", "whisper", "ffmpeg", "subtitle", "asr", "douyin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "faster-whisper>=1.0.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
readvideo = "readvideo.cli:main"
rv = "readvideo.cli:main"

[project.urls]
Homepage = "https://github.com/norwaren/read-video"
Issues = "https://github.com/norwaren/read-video/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/readvideo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
