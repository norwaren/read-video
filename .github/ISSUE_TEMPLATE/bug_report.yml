name: Bug report
description: 报告一个问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先跑 `rv --version` 和 `python -V`。**URL 里的签名参数请打码**。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 完整命令
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 完整报错
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: "`rv --version` / `python -V` / ffmpeg 版本"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
